name: עדכון אוטומטי - קבלות מהבנק
on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: update
jobs:
  update:
    if: github.repository != 'y0548434290-dot/kabalot-app'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: בדיקה ועדכון לגרסה האחרונה
        run: |
          git clone --depth 1 https://github.com/y0548434290-dot/kabalot-app.git /tmp/up
          rsync -a --checksum --delete --exclude .git --exclude .github /tmp/up/ ./
          if [ -n "$(git status --porcelain)" ]; then
            # בשם בעל המאגר: במסלול החינמי של Vercel, העלאה של שינוי בשם מישהו אחר נחסמת
            git config user.name "${{ github.repository_owner }}"
            git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
            git add -A
            git commit -m "עדכון לגרסה $(cat VERSION)"
            git push
            echo "עודכן לגרסה $(cat VERSION)"
          else
            echo "כבר בגרסה האחרונה ($(cat VERSION))"
          fi
